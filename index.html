  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 40px 20px;

      background-position: center;
      background-attachment: fixed;
    }

    .window {
      width: 100%;
      max-width: 660px;
      border: 1px solid #243042;
      border-radius: 14px;
      overflow: hidden;
      background: #0b0e14;
      box-shadow: 0 40px 120px rgba(0,0,0,.6), 0 0 0 1px rgba(70,230,176,.05), 0 0 60px rgba(70,230,176,.06);

    /* title bar */
    .titlebar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 14px 18px;
      border-bottom: 1px solid #1a2230;
      background: #0e131d;

    .dot { width: 12px; height: 12px; border-radius: 50%; }

    .titlebar .shell { font-size: 12px; color: #3d4756; }

    /* body */
    .body { padding: 34px 40px 26px; }
    .accent { color: #46e6b0; }

    header.who { display: flex; align-items: center; gap: 20px; }
    .avatar {
      width: 84px; height: 84px; flex: none;
      border-radius: 12px; object-fit: cover;
      background: #11151f; border: 1px solid #1e2632;
    }
    .who .cmd { font-size: 14px; }
    .who h1 {
      margin: 5px 0 0;
      font-size: 23px; font-weight: 700; line-height: 1.2;
      color: #e4ebf5; white-space: nowrap;
    }
    .who .handle { margin-top: 6px; font-size: 14px; color: #5b6677; }

    .bio { margin: 24px 0 0; font-size: 15px; line-height: 1.7; color: #8a94a3; }

    nav.social { display: flex; gap: 11px; margin-top: 24px; }
    nav.social a {
      display: grid; place-items: center;
      width: 46px; height: 46px;
      border: 1px solid #1f2937; border-radius: 9px;
      color: #cdd6e4; text-decoration: none;
      transition: border-color .15s, color .15s;
    }
    nav.social a:hover, nav.social a:focus-visible { border-color: #46e6b0; color: #46e6b0; }
    nav.social svg { width: 21px; height: 21px; }

    .repos-label { display: flex; align-items: center; gap: 8px; margin: 32px 0 14px; font-size: 13px; color: #5b6677; }
    .repos { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .repos a {
      display: flex; align-items: center; gap: 11px;
      padding: 15px 16px;
      border: 1px solid #1e2632; border-radius: 10px;
      background: #11151f; color: #cdd6e4;
      text-decoration: none; font-size: 15px;
      transition: border-color .15s, background .15s;
    }
    .repos a:hover, .repos a:focus-visible { border-color: #46e6b0; background: #101a18; }
    .repos a .name { flex: 1; }
    .repos a .tag { font-size: 11px; color: #5b6677; }

    .prompt { margin-top: 26px; font-size: 15px; color: #46e6b0; }
    .caret {
      display: inline-block; width: 9px; height: 17px;
      background: #46e6b0; vertical-align: -3px;
      animation: blink 1.1s steps(1) infinite;
    }
    @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }

    /* powerline status bar */
    .statusbar {
      display: flex; align-items: stretch;
      height: 30px;
      background: #0e131d; border-top: 1px solid #1a2230;
      font-size: 12.5px; font-weight: 700;
      overflow: hidden; white-space: nowrap;
    }
    .seg { position: relative; display: inline-flex; align-items: center; }
    .seg.right-arrow::after {
      content: ''; position: absolute; right: -11px; top: 0; z-index: 2;
      border-top: 15px solid transparent; border-bottom: 15px solid transparent;
    }
    .seg.left-arrow::before {
      content: ''; position: absolute; left: -11px; top: 0; z-index: 2;
      border-top: 15px solid transparent; border-bottom: 15px solid transparent;
    }
    .seg-host  { padding: 0 12px 0 16px; background: #a3c23f; color: #15180c; }
    .seg-host::after  { border-left: 11px solid #a3c23f; }
    .seg-path  { padding: 0 12px 0 20px; background: #2f6d84; color: #dceaf1; }
    .seg-path::after  { border-left: 11px solid #2f6d84; }
    .seg-git   { gap: 7px; padding: 0 14px 0 20px; background: #d4a13c; color: #2a1f0a; }
    .seg-git::after   { border-left: 11px solid #d4a13c; }
    .seg-spacer { flex: 1; }
    .seg-online { gap: 6px; padding: 0 14px 0 22px; background: #5f9e3f; color: #0e1408; }
    .seg-online::before { border-right: 11px solid #5f9e3f; }
    .seg-online .led { width: 6px; height: 6px; border-radius: 50%; background: #0e1408; }
    .seg-clock { padding: 0 16px 0 22px; background: #2b3038; color: #aeb6bf; }
    .seg-clock::before { border-right: 11px solid #2b3038; }
    .seg-git svg { width: 13px; height: 13px; }

    @media (max-width: 520px) {
      .body { padding: 26px 22px 22px; }
      .repos { grid-template-columns: 1fr; }
      .seg-host, .seg-path { font-size: 11.5px; }
    }

  <script>
    (function () {
      var el = document.getElementById('clock');
      function tick() {
        try {
          el.textContent = new Intl.DateTimeFormat([], {
            hour: '2-digit', minute: '2-digit', second: '2-digit',
            hour12: false, timeZoneName: 'short'
          }).format(new Date()).replace(',', '');
        } catch (e) {
          el.textContent = new Date().toTimeString().slice(0, 8);
        }
      }
      tick();
      setInterval(tick, 1000);
    })();
  </script>
